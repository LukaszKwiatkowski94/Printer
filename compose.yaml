services:
  workspace:
    image: printer-workspace:local
    volumes:
      - .:/workspaces/printer
    working_dir: /workspaces/printer
    command: sleep infinity
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: printer
      MYSQL_USER: printer
      MYSQL_PASSWORD: printer_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
